{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    
</head>
<body>
    <div class="w-1/2 mx-auto mt-8">
        <div>
            {% if messages %}
                {% for message in messages %}
                  <p>  {{message}}</p>
                {% endfor %}
            {% endif %}
        </div>
        <form method="POST">
            <input type="text" class="border-2 border-gray-300 p-2 w-full" name="title" placeholder="Enter task title" required>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mb-5 bg-rose-600 px-3 py-2 text-white mt-2 rounded-md">Submit</button>
        </form>
    </div>
</body>
</html>
